<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar - Interactive</title>
<style>

    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
    :root {
        --bg-pina: #FDFBF7;
        --text-dark: #1E293B;
        --text-muted: #475569;
        --primary-blue: #1D3557; 
        --accent-wood: #8B4513; 
        --accent-gold: #D4AF37; 
        --card-bg: #FFFFFF;
        --border: #E2E8F0;
    }
    body { margin:0; font-family:'Nunito', sans-serif; background-color:var(--bg-pina); color:var(--text-dark); display:flex; flex-direction:column; align-items:center; min-height:100vh; padding-bottom:40px;}
    .breadcrumbs { font-size:15px; color:var(--text-muted); margin-bottom:10px; text-align:left; width:100%; max-width:800px; padding-top:30px; }
    .breadcrumbs a { color:var(--primary-blue); text-decoration:none; font-weight:bold; transition: 0.2s;}
    .breadcrumbs a:hover { color:var(--accent-wood); }
    .card { background:var(--card-bg); border-radius:12px; box-shadow:0 4px 10px rgba(29, 53, 87, 0.08); padding:40px; max-width:800px; width:90%; border-top:5px solid var(--primary-blue); margin-top:10px;}
    h1 { color:var(--primary-blue); font-size:32px; border-bottom:2px solid var(--border); padding-bottom:10px; margin-top:0; }
    h2 { color:var(--accent-wood); font-size:24px; margin-top:30px; }
    p, li { font-size:18px; line-height:1.6; color:var(--text-muted); }
    ul { padding-left: 20px; }
    li { margin-bottom: 10px; }
    .grammar-box { background-color: #F8FAFC; border-left: 4px solid var(--accent-gold); padding: 15px 20px; border-radius: 0 8px 8px 0; margin: 20px 0; font-style: italic; }
    .btn { display:inline-block; background-color:var(--primary-blue); color:white; padding:12px 28px; text-decoration:none; border-radius:8px; font-weight:bold; font-size: 18px; transition:0.2s; border:none; cursor:pointer; margin-top: 20px;}
    .btn:hover { background-color:var(--accent-wood); transform: translateY(-2px); }
    .btn-outline { background-color:transparent; border:2px solid var(--border); color:var(--text-muted); margin-right: 10px; }
    .btn-outline:hover { border-color:var(--primary-blue); color:var(--primary-blue); background-color: transparent; }


    .cat-image { width: 220px; height: 220px; margin: 0 auto 20px auto; border-radius: 50%; background-image: url('../../img/gatos_verbos.jpg'); background-size: 300% 400%; background-repeat: no-repeat; border: 4px solid var(--border); }
    .comer { background-position: 0% calc(0% - 30px); } .dormir { background-position: 50% calc(0% - 30px); } .jugar { background-position: 100% calc(0% - 30px); }
    .caminar { background-position: 0% calc(33.33% - 30px); } .hablar { background-position: 50% calc(33.33% - 30px); } .pensar { background-position: 100% calc(33.33% - 30px); }
    .correr { background-position: 0% calc(66.66% - 30px); } .cantar { background-position: 50% calc(66.66% - 30px); } .esperar { background-position: 100% calc(66.66% - 30px); }
    .dibujar { background-position: 0% calc(100% - 30px); } .aprender { background-position: 50% calc(100% - 30px); } .original { background-position: 100% calc(100% - 30px); }
    .spanish-word { font-size: 42px; font-weight: 900; color: var(--primary-blue); margin: 10px 0; text-transform: uppercase; }
    .english-word { font-size: 22px; color: var(--accent-wood); margin: 0; font-weight:bold; }
    .controls { margin-top: 30px; display:flex; justify-content:center; gap:15px; }

.emoji-display { font-size: 130px; margin: 0 0 20px 0; line-height: 1; }
.grammar-note { font-size: 16px; color: var(--text-muted); background: #F8FAFC; padding: 10px; border-radius: 8px; border-left: 4px solid var(--accent-gold); font-style: italic; margin-top:20px; display:inline-block;}
</style>
</head>
<body>
<div class="breadcrumbs" style="text-align:center; padding-top:20px; margin-bottom:0;">
    <a href="teoria.html">⬅️ Back to Theory</a>
</div>
<div class="card" style="text-align:center;">
    <div id="emoji-display" class="emoji-display">💡</div>
    <h2 id="spanish-display" class="spanish-word">Querer vs Tener que</h2>
    <p id="english-display" class="english-word">Want to vs Have to</p>
    <div id="grammar-note" class="grammar-note">Desire vs. Obligation</div>
    <div class="controls">
        <button class="btn btn-outline" onclick="prevSlide()">Previous</button>
        <button class="btn" onclick="nextSlide()" style="margin-top:0;">Next ➡️</button>
    </div>
</div>
<script>
    const slides = [
        { emoji: '💡', es: 'Querer vs Tener que', en: "Want to vs Have to", note: "Desire vs. Obligation" },
        { emoji: '🙋‍♂️', es: 'Yo quiero aprender', en: "I want to learn", note: "Querer = To want" },
        { emoji: '📚', es: 'Yo tengo que leer', en: "I have to read", note: "Tener que = To have to (Obligation)" },
        { emoji: '🍔', es: 'Tú quieres comer', en: "You want to eat", note: "Informal 'You'" },
        { emoji: '❗', es: 'Tú tienes que estudiar', en: "You have to study", note: "Informal 'You'" },
        { emoji: '🎮', es: 'Él quiere jugar', en: "He wants to play", note: "He / She / Formal You" },
        { emoji: '⏰', es: 'Él tiene que dormir', en: "He has to sleep", note: "He / She / Formal You" },
        { emoji: '🏃‍♂️', es: 'Nosotros queremos correr', en: "We want to run", note: "We" },
        { emoji: '🚶‍♂️', es: 'Nosotros tenemos que caminar', en: "We have to walk", note: "We" },
        { emoji: '🎤', es: 'Ellos quieren cantar', en: "They want to sing", note: "They / You all" },
        { emoji: '⏳', es: 'Ellos tienen que esperar', en: "They have to wait", note: "They / You all" }
    ];
    let currentSlide = 0;
    function updateSlide() {
        document.getElementById('emoji-display').innerText = slides[currentSlide].emoji;
        document.getElementById('spanish-display').innerText = slides[currentSlide].es;
        document.getElementById('english-display').innerText = slides[currentSlide].en;
        document.getElementById('grammar-note').innerText = slides[currentSlide].note;
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; updateSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; updateSlide(); } }
</script>
</body>
</html>
