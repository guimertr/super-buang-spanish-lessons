<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbs - Interactive</title>
<style>

    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
    :root {
        /* Paleta Extraída */
        --color-sage: #D3DCBC;
        --color-olive: #7E8E65;
        --color-beige: #D1D0BE;
        --color-caramel: #BB915D;
        --color-mustard: #E6D56C;
        
        /* Colores de apoyo */
        --text-dark: #2C3523;
        --text-muted: #55604E;
        --card-bg: #FFFFFF;
        --border: #D1D0BE;
    }
    body { margin:0; font-family:'Nunito', sans-serif; background-color:var(--color-sage); color:var(--text-dark); display:flex; flex-direction:column; align-items:center; min-height:100vh; padding-bottom:40px;}
    
    .breadcrumbs { font-size:15px; color:var(--text-muted); margin-bottom:10px; text-align:left; width:100%; max-width:800px; padding-top:30px; }
    .breadcrumbs a { color:var(--color-olive); text-decoration:none; font-weight:bold; transition: 0.2s;}
    .breadcrumbs a:hover { color:var(--color-caramel); }
    
    .card { background:var(--card-bg); border-radius:12px; box-shadow:0 4px 10px rgba(44, 53, 35, 0.08); padding:40px; max-width:800px; width:90%; border-top:5px solid var(--color-olive); margin-top:10px;}
    
    h1 { color:var(--color-olive); font-size:32px; border-bottom:2px solid var(--border); padding-bottom:10px; margin-top:0; }
    h2 { color:var(--color-caramel); font-size:24px; margin-top:30px; }
    p, li { font-size:18px; line-height:1.6; color:var(--text-muted); }
    ul { padding-left: 20px; }
    li { margin-bottom: 10px; }
    
    .grammar-box { background-color: #F4F5F0; border-left: 4px solid var(--color-mustard); padding: 15px 20px; border-radius: 0 8px 8px 0; margin: 20px 0; font-style: italic; }
    
    .btn { display:inline-block; background-color:var(--color-olive); color:white; padding:12px 28px; text-decoration:none; border-radius:8px; font-weight:bold; font-size: 18px; transition:0.2s; border:none; cursor:pointer; margin-top: 20px;}
    .btn:hover { background-color:var(--color-caramel); transform: translateY(-2px); }
    
    .btn-outline { background-color:transparent; border:2px solid var(--border); color:var(--text-muted); margin-right: 10px; }
    .btn-outline:hover { border-color:var(--color-olive); color:var(--color-olive); background-color: transparent; }

    .cat-image { width: 220px; height: 220px; margin: 0 auto 20px auto; border-radius: 50%; background-image: url('../../img/gatos_verbos.jpg'); background-size: 300% 400%; background-repeat: no-repeat; border: 4px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .comer { background-position: 0% calc(0% - 30px); } .dormir { background-position: 50% calc(0% - 30px); } .jugar { background-position: 100% calc(0% - 30px); }
    .caminar { background-position: 0% calc(33.33% - 30px); } .hablar { background-position: 50% calc(33.33% - 30px); } .pensar { background-position: 100% calc(33.33% - 30px); }
    .correr { background-position: 0% calc(66.66% - 30px); } .cantar { background-position: 50% calc(66.66% - 30px); } .esperar { background-position: 100% calc(66.66% - 30px); }
    .dibujar { background-position: 0% calc(100% - 30px); } .aprender { background-position: 50% calc(100% - 30px); } .original { background-position: 100% calc(100% - 30px); }
    
    .spanish-word { font-size: 42px; font-weight: 900; color: var(--color-olive); margin: 10px 0; text-transform: uppercase; }
    .english-word { font-size: 22px; color: var(--color-caramel); margin: 0; font-weight:bold; }
    
    .controls { margin-top: 30px; display:flex; justify-content:center; gap:15px; }
</style>
</head>
<body>
<div class="breadcrumbs" style="text-align:center; padding-top:20px; margin-bottom:0;">
    <a href="teoria.html">⬅️ Back to Theory</a>
</div>
<div class="card" style="text-align:center;">
    <div id="cat-display" class="cat-image original"></div>
    <h2 id="spanish-display" class="spanish-word">VERBOS</h2>
    <p id="english-display" class="english-word">Verbs</p>
    <div class="controls">
        <button class="btn btn-outline" onclick="prevSlide()">Previous</button>
        <button class="btn" onclick="nextSlide()" style="margin-top:0;">Next ➡️</button>
    </div>
</div>
<script>
    const slides = [
        { catClass: 'original', es: 'Los Verbos', en: 'Verbs' }, { catClass: 'comer', es: 'Comer', en: 'to eat' },
        { catClass: 'dormir', es: 'Dormir', en: 'to sleep' }, { catClass: 'jugar', es: 'Jugar', en: 'to play' },
        { catClass: 'caminar', es: 'Caminar', en: 'to walk' }, { catClass: 'hablar', es: 'Hablar', en: 'to talk' },
        { catClass: 'pensar', es: 'Pensar', en: 'to think' }, { catClass: 'correr', es: 'Correr', en: 'to run' },
        { catClass: 'cantar', es: 'Cantar', en: 'to sing' }, { catClass: 'esperar', es: 'Esperar', en: 'to wait' },
        { catClass: 'dibujar', es: 'Dibujar', en: 'to draw' }, { catClass: 'aprender', es: 'Aprender', en: 'to learn' }
    ];
    let currentSlide = 0;
    function updateSlide() {
        document.getElementById('cat-display').className = 'cat-image ' + slides[currentSlide].catClass;
        document.getElementById('spanish-display').innerText = slides[currentSlide].es;
        document.getElementById('english-display').innerText = slides[currentSlide].en;
    }
    function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; updateSlide(); } }
    function prevSlide() { if (currentSlide > 0) { currentSlide--; updateSlide(); } }
</script>
</body>
</html>
