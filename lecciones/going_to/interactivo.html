<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Going to - Interactive</title>
<style>

    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');
    :root {
        --bg-pina: #FDFBF7;
        --text-dark: #1E293B;
        --text-muted: #475569;
        --primary-blue: #1D3557; 
        --accent-wood: #8B4513; 
        --accent-gold: #D4AF37; 
        --card-bg: #FFFFFF;
        --border: #E2E8F0;
    }
    body { margin:0; font-family:'Nunito', sans-serif; background-color:var(--bg-pina); color:var(--text-dark); display:flex; flex-direction:column; align-items:center; min-height:100vh; padding-bottom:40px;}
    .breadcrumbs { font-size:15px; color:var(--text-muted); margin-bottom:10px; text-align:left; width:100%; max-width:800px; padding-top:30px; }
    .breadcrumbs a { color:var(--primary-blue); text-decoration:none; font-weight:bold; transition: 0.2s;}
    .breadcrumbs a:hover { color:var(--accent-wood); }
    .card { background:var(--card-bg); border-radius:12px; box-shadow:0 4px 10px rgba(29, 53, 87, 0.08); padding:40px; max-width:800px; width:90%; border-top:5px solid var(--primary-blue); margin-top:10px;}
    h1 { color:var(--primary-blue); font-size:32px; border-bottom:2px solid var(--border); padding-bottom:10px; margin-top:0; }
    h2 { color:var(--accent-wood); font-size:24px; margin-top:30px; }
    p, li { font-size:18px; line-height:1.6; color:var(--text-muted); }
    ul { padding-left: 20px; }
    li { margin-bottom: 10px; }
    .grammar-box { background-color: #F8FAFC; border-left: 4px solid var(--accent-gold); padding: 15px 20px; border-radius: 0 8px 8px 0; margin: 20px 0; font-style: italic; }
    .btn { display:inline-block; background-color:var(--primary-blue); color:white; padding:12px 28px; text-decoration:none; border-radius:8px; font-weight:bold; font-size: 18px; transition:0.2s; border:none; cursor:pointer; margin-top: 20px;}
    .btn:hover { background-color:var(--accent-wood); transform: translateY(-2px); }
    .btn-outline { background-color:transparent; border:2px solid var(--border); color:var(--text-muted); margin-right: 10px; }
    .btn-outline:hover { border-color:var(--primary-blue); color:var(--primary-blue); background-color: transparent; }


    .tool-controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
    .select-group { display: flex; flex-direction: column; align-items: flex-start; }
    .select-group label { font-size: 14px; font-weight: bold; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    select { padding: 12px 18px; font-size: 18px; border-radius: 8px; border: 2px solid var(--border); outline: none; font-family: inherit; font-weight: bold; color: var(--primary-blue); cursor: pointer; width: 220px; background-color: #f8f9fa; transition: border-color 0.2s; }
    select:focus { border-color: var(--accent-gold); }
    .result-box { background-color: #F8FAFC; border: 2px solid var(--primary-blue); border-radius: 12px; padding: 30px; margin-top: 10px; }
    .spa-result { font-size: 34px; font-weight: 900; color: var(--primary-blue); margin: 0 0 10px 0; }
    .eng-result { font-size: 20px; color: var(--accent-wood); margin: 0; font-weight: bold; font-style: italic; }

</style>
</head>
<body>
<div class="breadcrumbs" style="text-align:center; padding-top:20px; margin-bottom:0;">
    <a href="teoria.html">⬅️ Back to Theory</a>
</div>
<div class="card" style="text-align:center;">
    <h2>Constructor "Going to" 🎯</h2>
    <p style="margin-bottom: 30px;">Choose a subject and an action to see the construction.</p>
    <div class="tool-controls">
        <div class="select-group">
            <label>1. Who (Subject)</label>
            <select id="subjSelect" onchange="buildSentence()">
                <option value="0">Yo (I)</option>
                <option value="1">Tú (You)</option>
                <option value="2">Él/Ella (He/She)</option>
                <option value="3">Nosotros (We)</option>
                <option value="4">Ellos (They)</option>
            </select>
        </div>
        <div class="select-group">
            <label>2. What (Action)</label>
            <select id="verbSelect" onchange="buildSentence()">
                <option value="comer,eat">Comer (to eat)</option>
                <option value="dormir,sleep">Dormir (to sleep)</option>
                <option value="jugar,play">Jugar (to play)</option>
                <option value="caminar,walk">Caminar (to walk)</option>
                <option value="hablar,talk">Hablar (to talk)</option>
                <option value="pensar,think">Pensar (to think)</option>
                <option value="correr,run">Correr (to run)</option>
                <option value="cantar,sing">Cantar (to sing)</option>
                <option value="esperar,wait">Esperar (to wait)</option>
                <option value="dibujar,draw">Dibujar (to draw)</option>
                <option value="aprender,learn">Aprender (to learn)</option>
            </select>
        </div>
    </div>
    <div class="result-box">
        <h2 class="spa-result" id="spaText">Yo voy a comer</h2>
        <p class="eng-result" id="engText">I am going to eat</p>
    </div>
</div>
<script>
    const irConjugations = ["voy", "vas", "va", "vamos", "van"];
    const subjectsSpa = ["Yo", "Tú", "Él/Ella", "Nosotros", "Ellos"];
    const beConjugations = ["am", "are", "is", "are", "are"];
    const subjectsEng = ["I", "You", "He/She", "We", "They"];
    function buildSentence() {
        const subjIdx = parseInt(document.getElementById('subjSelect').value);
        const verbVal = document.getElementById('verbSelect').value;
        const verbParts = verbVal.split(',');
        const spaSentence = `${subjectsSpa[subjIdx]} ${irConjugations[subjIdx]} a ${verbParts[0]}`;
        const engSentence = `${subjectsEng[subjIdx]} ${beConjugations[subjIdx]} going to ${verbParts[1]}`;
        document.getElementById('spaText').innerText = spaSentence;
        document.getElementById('engText').innerText = engSentence;
    }
    window.onload = buildSentence;
</script>
</body>
</html>
