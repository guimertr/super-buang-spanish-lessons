<title>Práctica de Animales</title>
<style>

    .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; background-color: white; color: #333; padding: 10px 20px; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .back-btn:hover { background-color: #eee; }
    .quiz-container { background-color: white; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 40px; width: 600px; max-width: 90%; position: relative; }
    .progress { font-size: 16px; color: #777; margin-bottom: 20px; font-weight: bold; }
    .question { font-size: 28px; font-weight: bold; color: #333; margin-bottom: 10px; }
    .english-translation { font-size: 16px; color: #666; margin-bottom: 30px; font-style: italic; }
    .blank { display: inline-block; width: 150px; border-bottom: 3px solid #333; margin: 0 10px; text-align: center; font-style: italic; color: #007bff; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .option-btn { background-color: #f0f0f0; border: 2px solid #ddd; padding: 15px; font-size: 20px; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-weight: bold; color: #333; }
    .option-btn:hover { background-color: #e0e0e0; border-color: #ccc; }
    .option-btn:disabled { cursor: default; }
    .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
    .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
    .feedback { font-size: 24px; font-weight: bold; margin-bottom: 10px; min-height: 30px; }
    .explanation { font-size: 14px; color: #555; margin-bottom: 20px; min-height: 20px; }
    .next-btn { background-color: #28a745; border: none; padding: 10px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; display: none; margin: 0 auto; }
    .next-btn:hover { background-color: #218838; }
    
    .final-score { display: none; }
    .name-input { padding: 12px; font-size: 18px; border-radius: 8px; border: 2px solid #ccc; width: 80%; margin: 20px 0; outline: none; }
    .name-input:focus { border-color: #007bff; }
    .save-btn { background-color: #28a745; border: none; padding: 12px 25px; font-size: 18px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
    .save-btn:hover { background-color: #218838; }
    .restart-btn { background-color: #007bff; border: none; padding: 12px 25px; font-size: 18px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; margin-top: 15px; display: none; }
    .restart-btn:hover { background-color: #0069d9; }
    .success-msg { color: #28a745; font-size: 18px; font-weight: bold; margin-top: 15px; display: none; }
</style>
</head>
<body>
<a href="menu_actividades.html" class="back-btn">⬅️ Volver a Actividades</a>
<div class="quiz-container" id="quiz-box">

    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente ➡️</button>
</div>

<div class="quiz-container final-score" id="result-box">
    <h1>¡Práctica Completada! 🎉</h1>
    <p style="font-size: 24px;">Tu puntaje: <strong id="score-display">0/10</strong></p>

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function startQuiz() {
        // Seleccionamos siempre 10 aleatorias para la partida
        const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, 10);
        currentQuestionIndex = 0;
        score = 0;
        
        document.getElementById('save-section').style.display = 'block';
        document.getElementById('success-message').style.display = 'none';
        document.getElementById('restart-btn').style.display = 'none';
        document.getElementById('student-name').value = '';
        
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('result-box').style.display = 'none';
        
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuestions[currentQuestionIndex];
        document.getElementById('progress').innerText = `Pregunta ${currentQuestionIndex + 1} de 10`;
        
        let displaySentence = q.sentence.replace(q.missing, '<span class="blank">?</span>');
        document.getElementById('question-text').innerHTML = displaySentence;
        document.getElementById('english-translation').innerText = "(" + q.engFull + ")";
        
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('explanation').innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        // Las opciones ya vienen mezcladas desde el array base
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedText, questionData) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);
        
        const isCorrect = selectedText === questionData.missing;
        
        if (isCorrect) {
            selectedBtn.classList.add('correct');
            document.getElementById('feedback').innerHTML = '✅ ¡Correcto!';
            document.getElementById('feedback').style.color = '#28a745';
            score++;
            document.getElementById('question-text').innerHTML = questionData.sentence.replace(questionData.missing, `<span class="blank" style="color: #28a745; border-color: #28a745;">${questionData.missing}</span>`);
        } else {
            selectedBtn.classList.add('wrong');
            buttons.forEach(btn => {
                if(btn.innerText === questionData.missing) {
                    btn.classList.add('correct');
                }
            });
            document.getElementById('feedback').innerHTML = '❌ Incorrecto';
            document.getElementById('feedback').style.color = '#dc3545';
            document.getElementById('question-text').innerHTML = questionData.sentence.replace(questionData.missing, `<span class="blank" style="color: #dc3545; border-color: #dc3545;">${questionData.missing}</span>`);
        }
        
        document.getElementById('explanation').innerText = questionData.exp;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < 10) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('score-display').innerText = `${score}/10`;
        
        const lastNames = localStorage.getItem('lastStudentName');
        if(lastNames) {
            document.getElementById('student-name').value = lastNames;
        }
    }

    function saveAndSend() {
        const nameInput = document.getElementById('student-name').value.trim();
        
        if(nameInput === "") {
            alert("Por favor, ingresa tu nombre antes de guardar.");
            return;
        }
        
        localStorage.setItem('lastStudentName', nameInput);
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-ES'); 
        const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); 
        
        // ¡AGREGAMOS EL CAMPO ACTIVIDAD AQUÍ!
        const record = {
            actividad: 'Animales',
            name: nameInput,
            score: score,
            total: 10,
            date: dateStr,
            time: timeStr
        };
        
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw1BxtqYUMinRLcVe-e-lLXgQZyAN3X-VFUU3a6CDJX_HfBBv3_5lidAgS4Ow0DU4i-8w/exec';
        
        document.getElementById('save-section').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
        document.getElementById('restart-btn').style.display = 'inline-block';
        
        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(record),
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            }
        })
        .then(response => console.log('¡Guardado en Sheets con éxito!'))
        .catch(error => console.error('Error al guardar en Sheets:', error));
    }

    window.onload = startQuiz;
