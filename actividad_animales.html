<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica de Animales</title>
<style>
    body { font-family: 'Arial', sans-serif; background-color: #e6ffe6; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; background-color: white; color: #333; padding: 10px 20px; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .back-btn:hover { background-color: #eee; }
    .quiz-container { background-color: white; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 40px; width: 600px; max-width: 90%; position: relative; }
    .progress { font-size: 16px; color: #777; margin-bottom: 20px; font-weight: bold; }
    .question { font-size: 28px; font-weight: bold; color: #333; margin-bottom: 10px; }
    .english-translation { font-size: 16px; color: #666; margin-bottom: 30px; font-style: italic; }
    .blank { display: inline-block; width: 150px; border-bottom: 3px solid #333; margin: 0 10px; text-align: center; font-style: italic; color: #007bff; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .option-btn { background-color: #f0f0f0; border: 2px solid #ddd; padding: 15px; font-size: 20px; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-weight: bold; color: #333; }
    .option-btn:hover { background-color: #e0e0e0; border-color: #ccc; }
    .option-btn:disabled { cursor: default; }
    .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
    .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
    .feedback { font-size: 24px; font-weight: bold; margin-bottom: 10px; min-height: 30px; }
    .explanation { font-size: 14px; color: #555; margin-bottom: 20px; min-height: 20px; }
    .next-btn { background-color: #28a745; border: none; padding: 10px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; display: none; margin: 0 auto; }
    .next-btn:hover { background-color: #218838; }
    
    .final-score { display: none; }
    .name-input { padding: 12px; font-size: 18px; border-radius: 8px; border: 2px solid #ccc; width: 80%; margin: 20px 0; outline: none; }
    .name-input:focus { border-color: #007bff; }
    .save-btn { background-color: #28a745; border: none; padding: 12px 25px; font-size: 18px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
    .save-btn:hover { background-color: #218838; }
    .restart-btn { background-color: #007bff; border: none; padding: 12px 25px; font-size: 18px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; margin-top: 15px; display: none; }
    .restart-btn:hover { background-color: #0069d9; }
    .success-msg { color: #28a745; font-size: 18px; font-weight: bold; margin-top: 15px; display: none; }
</style>
</head>
<body>
<a href="menu_actividades.html" class="back-btn">⬅️ Volver a Actividades</a>
<div class="quiz-container" id="quiz-box">
    <div class="progress" id="progress">Pregunta 1 de 10</div>
    <div class="question" id="question-text"></div>
    <div class="english-translation" id="english-translation"></div>
    <div class="options" id="options-container"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente ➡️</button>
</div>

<div class="quiz-container final-score" id="result-box">
    <h1>¡Práctica Completada! 🎉</h1>
    <p style="font-size: 24px;">Tu puntaje: <strong id="score-display">0/10</strong></p>
    
    <div id="save-section">
        <p>Ingresa tu nombre para guardar el resultado:</p>
        <input type="text" id="student-name" class="name-input" placeholder="Tu nombre y apellido">
        <br>
        <button class="save-btn" onclick="saveAndSend()">Guardar y Enviar 💾</button>
    </div>
    
    <div id="success-message" class="success-msg">¡Resultado guardado correctamente!</div>
    
    <button id="restart-btn" class="restart-btn" onclick="startQuiz()">Intentar de nuevo 🔄</button>
</div>

<script>
    const questionBank = [
        { sentence: "El _____ come huesos en la casa.", engFull: "The dog eats bones in the house.", missing: "perro", options: ["gato", "ratón", "perro", "conejo"], exp: "'El perro' es 'the dog'. Los perros comen huesos." },
        { sentence: "El _____ persigue al ratón.", engFull: "The cat chases the mouse.", missing: "gato", options: ["mono", "gato", "cerdo", "vaca"], exp: "'El gato' es 'the cat'. Los gatos cazan ratones." },
        { sentence: "El _____ es pequeño y come queso.", engFull: "The mouse is small and eats cheese.", missing: "ratón", options: ["oso", "león", "ratón", "perro"], exp: "'El ratón' es 'the mouse'. Los ratones son pequeños." },
        { sentence: "El _____ tiene orejas largas.", engFull: "The rabbit has long ears.", missing: "conejo", options: ["conejo", "mono", "gato", "rana"], exp: "'El conejo' es 'the rabbit'. Tienen orejas largas." },
        { sentence: "El _____ es grande y fuerte en el bosque.", engFull: "The bear is big and strong in the forest.", missing: "oso", options: ["cerdo", "oso", "ratón", "perro"], exp: "'El oso' es 'the bear'. Son animales grandes y fuertes." },
        { sentence: "El _____ es el rey de la selva.", engFull: "The lion is the king of the jungle.", missing: "león", options: ["gato", "conejo", "vaca", "león"], exp: "'El león' es 'the lion', conocido como el rey." },
        { sentence: "La _____ nos da leche.", engFull: "The cow gives us milk.", missing: "vaca", options: ["rana", "vaca", "león", "oso"], exp: "'La vaca' es 'the cow', produce leche." },
        { sentence: "El _____ es gordito y rosa.", engFull: "The pig is chubby and pink.", missing: "cerdo", options: ["mono", "cerdo", "perro", "gato"], exp: "'El cerdo' es 'the pig'. Son a menudo rosados." },
        { sentence: "La _____ salta en el agua.", engFull: "The frog jumps in the water.", missing: "rana", options: ["vaca", "rana", "conejo", "oso"], exp: "'La rana' es 'the frog'. Les gusta saltar en el agua." },
        { sentence: "El _____ come bananas en los árboles.", engFull: "The monkey eats bananas in the trees.", missing: "mono", options: ["perro", "ratón", "mono", "cerdo"], exp: "'El mono' es 'the monkey'. A los monos les gustan las bananas." },
        { sentence: "Vamos a caminar con el _____ por el parque.", engFull: "Let's walk with the dog in the park.", missing: "perro", options: ["rana", "vaca", "perro", "león"], exp: "Normalmente caminas con 'el perro' (the dog) por el parque." },
        { sentence: "El _____ está durmiendo en el sofá.", engFull: "The cat is sleeping on the couch.", missing: "gato", options: ["oso", "gato", "vaca", "cerdo"], exp: "'El gato' (the cat) a menudo duerme en el sofá de la casa." },
        { sentence: "Yo no quiero ver un _____ en la cocina.", engFull: "I don't want to see a mouse in the kitchen.", missing: "ratón", options: ["ratón", "león", "oso", "vaca"], exp: "No quieres ver un 'ratón' (mouse) en tu cocina." },
        { sentence: "El _____ salta muy alto en el jardín.", engFull: "The rabbit jumps very high in the garden.", missing: "conejo", options: ["cerdo", "conejo", "vaca", "oso"], exp: "'El conejo' (the rabbit) es conocido por saltar." },
        { sentence: "En el zoológico, yo quiero ver el _____ polar.", engFull: "At the zoo, I want to see the polar bear.", missing: "oso", options: ["perro", "gato", "ratón", "oso"], exp: "El 'oso' (bear) polar es un animal de zoológico, los otros son mascotas/plagas." },
        { sentence: "El _____ tiene una melena grande.", engFull: "The lion has a big mane.", missing: "león", options: ["mono", "rana", "león", "cerdo"], exp: "El 'león' (lion) macho tiene una gran melena." },
        { sentence: "La _____ hace 'muuuu' por la mañana.", engFull: "The cow goes 'moooo' in the morning.", missing: "vaca", options: ["rana", "vaca", "gato", "perro"], exp: "'La vaca' (the cow) hace el sonido 'muuuu'." },
        { sentence: "El _____ hace 'oink oink'.", engFull: "The pig goes 'oink oink'.", missing: "cerdo", options: ["cerdo", "mono", "león", "conejo"], exp: "'El cerdo' (the pig) hace el sonido 'oink oink'." },
        { sentence: "La _____ es verde y muy pequeña.", engFull: "The frog is green and very small.", missing: "rana", options: ["vaca", "rana", "león", "oso"], exp: "De las opciones, solo la 'rana' (frog) es verde y pequeña." },
        { sentence: "El _____ juega en las ramas largas.", engFull: "The monkey plays in the long branches.", missing: "mono", options: ["mono", "perro", "cerdo", "vaca"], exp: "El 'mono' (monkey) juega en las ramas de los árboles." }
    ];

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function startQuiz() {
        const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, 10);
        currentQuestionIndex = 0;
        score = 0;
        
        // Reiniciar la vista final
        document.getElementById('save-section').style.display = 'block';
        document.getElementById('success-message').style.display = 'none';
        document.getElementById('restart-btn').style.display = 'none';
        document.getElementById('student-name').value = '';
        
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('result-box').style.display = 'none';
        
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuestions[currentQuestionIndex];
        document.getElementById('progress').innerText = `Pregunta ${currentQuestionIndex + 1} de 10`;
        
        let displaySentence = q.sentence.replace(q.missing, '<span class="blank">?</span>');
        document.getElementById('question-text').innerHTML = displaySentence;
        document.getElementById('english-translation').innerText = "(" + q.engFull + ")";
        
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('explanation').innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const shuffledOptions = [...q.options].sort(() => 0.5 - Math.random());
        
        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedText, questionData) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);
        
        const isCorrect = selectedText === questionData.missing;
        
        if (isCorrect) {
            selectedBtn.classList.add('correct');
            document.getElementById('feedback').innerHTML = '✅ ¡Correcto!';
            document.getElementById('feedback').style.color = '#28a745';
            score++;
            document.getElementById('question-text').innerHTML = questionData.sentence.replace(questionData.missing, `<span class="blank" style="color: #28a745; border-color: #28a745;">${questionData.missing}</span>`);
        } else {
            selectedBtn.classList.add('wrong');
            buttons.forEach(btn => {
                if(btn.innerText === questionData.missing) {
                    btn.classList.add('correct');
                }
            });
            document.getElementById('feedback').innerHTML = '❌ Incorrecto';
            document.getElementById('feedback').style.color = '#dc3545';
            document.getElementById('question-text').innerHTML = questionData.sentence.replace(questionData.missing, `<span class="blank" style="color: #dc3545; border-color: #dc3545;">${questionData.missing}</span>`);
        }
        
        document.getElementById('explanation').innerText = questionData.exp;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < 10) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('score-display').innerText = `${score}/10`;
        
        // Sugerir el nombre si ya lo ingresó en un intento anterior
        const lastNames = localStorage.getItem('lastStudentName');
        if(lastNames) {
            document.getElementById('student-name').value = lastNames;
        }
    }

    function saveAndSend() {
        const nameInput = document.getElementById('student-name').value.trim();
        
        if(nameInput === "") {
            alert("Por favor, ingresa tu nombre antes de guardar.");
            return;
        }
        
        // Guardar nombre para sugerirlo la próxima vez
        localStorage.setItem('lastStudentName', nameInput);
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('es-ES'); 
        const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); 
        
        const record = {
            name: nameInput,
            score: score,
            total: 10,
            date: dateStr,
            time: timeStr
        };
        
        // 1. Guardar en LocalStorage
        let history = JSON.parse(localStorage.getItem('animalesHistory')) || [];
        history.push(record);
        localStorage.setItem('animalesHistory', JSON.stringify(history));

        // 2. Enviar a Google Sheets
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw1BxtqYUMinRLcVe-e-lLXgQZyAN3X-VFUU3a6CDJX_HfBBv3_5lidAgS4Ow0DU4i-8w/exec';
        
        // Cambiamos la interfaz a estado de carga/éxito inmediatamente
        document.getElementById('save-section').style.display = 'none';
        document.getElementById('success-message').style.display = 'block';
        document.getElementById('restart-btn').style.display = 'inline-block';
        
        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(record),
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            }
        })
        .then(response => console.log('¡Guardado en Sheets con éxito!'))
        .catch(error => console.error('Error al guardar en Sheets:', error));
    }

    window.onload = startQuiz;
</script>
</body>
</html>
