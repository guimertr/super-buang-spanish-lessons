    body { font-family: 'Arial', sans-serif; background-color: #fdf5e6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
    .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; background-color: white; color: #333; padding: 10px 20px; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

    .menu-container { background-color: white; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 40px 50px; width: 550px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
    h1 { color: #333; margin-bottom: 5px; font-size: 32px; }
    p { color: #777; margin-bottom: 30px; font-size: 16px; }
    
    .activity-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px auto; width: 100%; }

    .history-button { display: flex; justify-content: center; align-items: center; background-color: #6c757d; text-decoration: none; color: white; font-size: 26px; width: 60px; height: 60px; border-radius: 15px; transition: transform 0.2s, background-color 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-shrink: 0; }
    .history-button:hover { background-color: #5a6268; transform: scale(1.05); }

    .divider { height: 2px; background-color: #eee; margin: 30px 0; border-radius: 2px; }

    .central-btn { display: block; background-color: #007bff; text-decoration: none; color: white; font-size: 20px; font-weight: bold; padding: 15px; border-radius: 15px; margin: 0 auto; transition: transform 0.2s, background-color 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .central-btn:hover { background-color: #0056b3; transform: scale(1.03); }
