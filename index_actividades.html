    :root {

        --primary-blue: #1D3557;

    .back-btn { position: absolute; top: 30px; left: 30px; text-decoration: none; background-color: var(--card-bg); color: var(--primary-blue); padding: 10px 20px; border-radius: 10px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); transition: 0.2s; }

    h1 { margin-bottom: 5px; font-size: 32px; color: var(--primary-blue); }
    p { color: var(--text-muted); margin-bottom: 30px; font-size: 16px; }
    
    .activity-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px auto; width: 100%; }
    
    /* Botones uniformes con paleta filipina */
    .menu-button { display: flex; align-items: center; justify-content: flex-start; padding-left: 20px; background-color: var(--primary-blue); text-decoration: none; color: white; font-size: 20px; font-weight: bold; height: 60px; border-radius: 15px; flex-grow: 1; transition: transform 0.2s, background-color 0.2s, border-color 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid transparent; }
    .menu-button:hover { transform: translateY(-2px); background-color: var(--accent-wood); border-color: var(--accent-gold); }
    
    .history-button { display: flex; justify-content: center; align-items: center; background-color: #F8FAFC; text-decoration: none; color: var(--primary-blue); font-size: 26px; width: 60px; height: 60px; border-radius: 15px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); flex-shrink: 0; }
    .history-button:hover { background-color: var(--border); color: var(--accent-wood); transform: scale(1.05); }
